<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Av. Alperen KOCA | Yeşilhisar / Kayseri</title>
    <meta name="description" content="Av. Alperen KOCA. Yeşilhisar / Kayseri. İletişim bilgileri.">
    <meta name="theme-color" content="#f6f2ea">
    <meta property="og:title" content="Av. Alperen KOCA">
    <meta property="og:description" content="Yeşilhisar / Kayseri. İletişim bilgileri.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="tr_TR">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #121b2b;
            --paper: #f6f2ea;
            --brass: #b8914a;
            --brass-light: #c9a45c;
            --soft: #c8c2b4;
            --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { height: 100%; }

        body {
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--paper);
            color: var(--paper);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 2px solid var(--brass-light); outline-offset: 3px; }

        .card {
            width: min(520px, 100%);
            background: var(--ink);
            padding: 52px 48px 44px;
            position: relative;
            box-shadow: 0 30px 60px -36px rgba(18, 27, 43, .55);
        }
        .card::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(201, 164, 92, .4);
            pointer-events: none;
        }


        h1 {
            font-family: var(--serif);
            font-weight: 700;
            font-size: clamp(36px, 8vw, 46px);
            line-height: 1.05;
            letter-spacing: .01em;
        }
        .title {
            margin-top: 8px;
            font-size: 17px;
            color: var(--brass-light);
        }
        .bar {
            margin-top: 4px;
            font-size: 14px;
            color: var(--soft);
        }

        hr {
            border: 0;
            height: 1px;
            background: rgba(201, 164, 92, .4);
            margin: 32px 0 28px;
        }

        dl { display: grid; gap: 18px; }
        dt { font-size: 13px; color: var(--soft); }
        dd { font-size: 16px; }
        dd a { border-bottom: 1px solid transparent; transition: border-color .2s, color .2s; }
        dd a:hover { color: var(--brass-light); border-color: var(--brass-light); }


        @media (max-width: 480px) {
            body { padding: 16px; }
            .card { padding: 44px 28px 32px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Av. Alperen KOCA</h1>
        <p class="title">Avukat</p>
        <p class="bar">Kayseri Barosu Sicil No: 4403<br>T.B.B. Sicil No: 234138</p>

        <hr>

        <dl>
            <div>
                <dt>Adres</dt>
                <dd>Cumhuriyet Mah. Çay Sok. No:11/5 Kat:3<br>Yeşilhisar / Kayseri</dd>
            </div>
            <div>
                <dt>Telefon</dt>
                <dd><a href="tel:+905544847619">+90 554 484 76 19</a></dd>
            </div>
            <div>
                <dt>E-posta</dt>
                <dd><a href="mailto:alperenkoca@kayseri.av.tr">alperenkoca@kayseri.av.tr</a></dd>
            </div>
            <div>
                <dt>KEP</dt>
                <dd>alperen.koca@hs01.kep.tr</dd>
            </div>
        </dl>

    </main>
</body>
</html>
